services:
  nominatim:
    image: ${NOMINATIM_IMAGE:-mediagis/nominatim:5.3}
    container_name: seta-expreso-nominatim-cuba
    restart: no
    environment:
      PBF_URL: ${PBF_URL:-https://download.geofabrik.de/central-america/cuba-latest.osm.pbf}
    ports:
      - "${NOMINATIM_PORT:-8080}:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status.php', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
volumes:
  nominatim-data:
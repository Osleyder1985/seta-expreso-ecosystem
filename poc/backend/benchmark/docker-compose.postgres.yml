services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: seta-expreso-benchmark-postgres
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 2s
      timeout: 2s
      retries: 30

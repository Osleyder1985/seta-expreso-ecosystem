services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    ports: ["5434:5432"]
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
  api:
    build: .
    ports: ["8081:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: Host=postgres;Port=5432;Database=poc;Username=poc;Password=poc
    depends_on: [postgres]
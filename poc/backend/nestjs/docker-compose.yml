services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    ports: ["5433:5432"]
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://poc:poc@postgres:5432/poc
    depends_on: [postgres]
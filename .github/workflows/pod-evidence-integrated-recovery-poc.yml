name: POD integrated recovery PoC

permissions:
  contents: read

on:
  push:
    branches: [main, "poc/**"]
  pull_request:
    paths:
      - "poc/pod-evidence-recovery/**"
      - ".github/workflows/pod-evidence-integrated-recovery-poc.yml"

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: "3.12"}
      - name: Run PoC
        run: python poc/pod-evidence-recovery/runner.py > recovery-results.json
      - name: Validate scenarios
        run: |
          python - <<'PY'
          import json
          d=json.load(open("recovery-results.json"))
          assert d["R02_restore_complete"]["missing_content"] == []
          assert d["R02_restore_complete"]["orphan_objects"] == []
          assert d["R02_restore_complete"]["corrupt_content"] == []
          assert len(d["R03_missing_content"]["missing_content"]) == 1
          assert len(d["R04_corrupt_content"]["corrupt_content"]) == 1
          assert len(d["R06_orphan_object"]["orphan_objects"]) == 1
          assert d["R08_partial_recovery"]["after"]["missing_content"] == []
          assert d["R08_partial_recovery"]["after"]["corrupt_content"] == []
          print("All recovery assertions passed.")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pod-evidence-integrated-recovery-results
          path: recovery-results.json

name: postgres-postgis-foundation

on:
  pull_request:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/src/modules/database/**'
      - 'apps/api/scripts/verify-database-foundation.mjs'
      - 'apps/api/package.json'
      - 'apps/api/.env.example'
      - 'infra/postgres/**'
      - '.github/workflows/postgres-postgis-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/src/modules/database/**'
      - 'apps/api/scripts/verify-database-foundation.mjs'
      - 'apps/api/package.json'
      - 'apps/api/.env.example'
      - 'infra/postgres/**'
      - '.github/workflows/postgres-postgis-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: seta_expreso
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seta_expreso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/api/package.json

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seta_expreso

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seta_expreso

      - name: Deploy migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seta_expreso

      - name: Verify PostGIS foundation
        run: node scripts/verify-database-foundation.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seta_expreso

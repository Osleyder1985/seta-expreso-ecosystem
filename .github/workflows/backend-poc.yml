name: Backend PoCs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'poc/backend/**'
      - '.github/workflows/backend-poc.yml'

jobs:
  nestjs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc
          POSTGRES_DB: poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d poc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: poc/backend/nestjs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: poc/backend/nestjs/package.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm install
      - run: psql postgresql://poc:poc@localhost:5432/poc -f init.sql
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://poc:poc@localhost:5432/poc

  aspnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc
          POSTGRES_DB: poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d poc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: poc/backend/aspnet-core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql postgresql://poc:poc@localhost:5432/poc -f init.sql
      - run: dotnet build -c Release
      - run: dotnet test SetaExpreso.Poc.Tests/SetaExpreso.Poc.Tests.csproj -c Release
        env:
          DATABASE_URL: Host=localhost;Port=5432;Database=poc;Username=poc;Password=poc

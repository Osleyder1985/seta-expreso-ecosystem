permissions:
  contents: read

name: pod-evidence-storage-poc

on:
  push:
    branches:
      - main
      - 'poc/**'
  pull_request:
    paths:
      - 'poc/pod-evidence-storage/**'
      - '.github/workflows/pod-evidence-storage-poc.yml'

jobs:
  filesystem-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Execute reproducible filesystem baseline
        run: python poc/pod-evidence-storage/runner.py

      - name: Validate structured result
        run: python -c "import json; p=json.load(open('poc/pod-evidence-storage/results.json')); assert p['implementation']=='filesystem'; assert set(p['tests']) == {'1MiB','5MiB','10MiB','20MiB'}"

      - name: Publish PoC results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pod-evidence-storage-results
          path: poc/pod-evidence-storage/results.json

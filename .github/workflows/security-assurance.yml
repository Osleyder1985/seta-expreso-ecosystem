name: Security Assurance

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: SEC-00 Workflow execution smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner execution
        run: |
          set -euo pipefail
          echo "Security Assurance workflow execution reached the runner."
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"

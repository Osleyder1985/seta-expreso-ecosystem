name: Security Assurance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: SEC-01 Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-dependencies:
    name: Detect dependency manifests
    runs-on: ubuntu-latest
    outputs:
      has_dependencies: ${{ steps.detect.outputs.has_dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name 'package.json' -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' -o -name 'yarn.lock' -o -name 'requirements.txt' -o -name 'poetry.lock' -o -name 'Pipfile.lock' -o -name '*.csproj' -o -name 'packages.lock.json' -o -name 'go.mod' -o -name 'go.sum' -o -name 'pom.xml' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \) -not -path './.git/*' | grep -q .; then
            echo "has_dependencies=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dependencies=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    name: SEC-02 Dependency review
    needs: detect-dependencies
    if: ${{ github.event_name == 'pull_request' && needs.detect-dependencies.outputs.has_dependencies == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  dependency-review-na:
    name: SEC-02 Dependency review N/A
    needs: detect-dependencies
    if: ${{ github.event_name == 'push' || needs.detect-dependencies.outputs.has_dependencies != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record N/A
        shell: bash
        run: echo "Dependency review is N/A because no dependency manifest is present or the event is not a pull request."

  workflow-permissions:
    name: SEC-03 Workflow permission baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows ]; then
            echo "No workflow directory present."
            exit 0
          fi
          if grep -RInE 'permissions:[[:space:]]*$' .github/workflows >/dev/null 2>&1; then
            echo "Workflow permission declarations found."
          else
            echo "No explicit workflow permissions found; review required."
            exit 1
          fi

  policy-file:
    name: SEC-04 Policy consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify assurance policy
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/security/security-assurance-v0.1.0.md
          grep -q "SEC-01" docs/security/security-assurance-v0.1.0.md
          grep -q "SEC-02" docs/security/security-assurance-v0.1.0.md
          grep -q "SEC-03" docs/security/security-assurance-v0.1.0.md
          grep -q "SEC-04" docs/security/security-assurance-v0.1.0.md

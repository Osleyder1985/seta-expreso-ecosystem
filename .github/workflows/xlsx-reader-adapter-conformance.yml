name: xlsx-reader-adapter-conformance

on:
  pull_request:
    paths:
      - 'apps/api/src/modules/paqueteria/import/**'
      - 'apps/api/package.json'
      - 'apps/api/jest.xlsx-readers.config.mjs'
      - '.github/workflows/xlsx-reader-adapter-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/modules/paqueteria/import/**'
      - 'apps/api/package.json'
      - 'apps/api/jest.xlsx-readers.config.mjs'
      - '.github/workflows/xlsx-reader-adapter-conformance.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/api/package.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Execute XLSX reader adapter tests
        run: npm run test:xlsx-readers

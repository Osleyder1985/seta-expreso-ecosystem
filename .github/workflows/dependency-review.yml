name: Dependency Review

# SEC-02: retained on the stacked feature branch; execution is sourced from the PR base workflow.
on:
  pull_request:
    branches:
      - main
      - feat/paqueteria-xlsx-workbook-reader
      - feat/paqueteria-xlsx-reader-comparison-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: SEC-02 Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical

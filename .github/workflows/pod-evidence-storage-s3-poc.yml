name: pod-evidence-storage-s3-poc

on:
  pull_request:
    paths:
      - 'poc/pod-evidence-storage/**'
      - '.github/workflows/pod-evidence-storage-s3-poc.yml'
  workflow_dispatch:

jobs:
  s3-compatible:
    runs-on: ubuntu-latest
    services:
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        volumes:
          - /tmp/minio-data:/data
        command: server /data --address ":9000"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r poc/pod-evidence-storage/requirements-s3.txt
      - env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: python poc/pod-evidence-storage/s3_runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: pod-evidence-storage-s3-results
          path: poc/pod-evidence-storage/s3-results.json

name: XLSX real manifest privacy probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-real-manifest-probe:
    name: Private real-manifest structural probe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/benchmark/xlsx-reader
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install benchmark dependencies
        run: npm ci --ignore-scripts

      - name: Materialize private manifest
        env:
          PRIVATE_MANIFEST_B64: ${{ secrets.XLSX_REAL_MANIFEST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_MANIFEST_B64}"
          printf '%s' "${PRIVATE_MANIFEST_B64}" | base64 --decode > private-real-manifest.xlsx
          test -s private-real-manifest.xlsx
          test "$(xxd -p -l 4 private-real-manifest.xlsx)" = "504b0304"

      - name: Run privacy-preserving probe
        run: |
          set -euo pipefail
          node compare-real-manifest.mjs private-real-manifest.xlsx > real-manifest-probe.stdout.json

      - name: Remove private workbook before artifact upload
        if: always()
        run: |
          rm -f private-real-manifest.xlsx

      - name: Publish privacy-preserving report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlsx-real-manifest-privacy-report
          path: |
            poc/benchmark/xlsx-reader/real-manifest-report.json
            poc/benchmark/xlsx-reader/real-manifest-probe.stdout.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail if any reader probe errored
        run: |
          node -e "const r=require('./real-manifest-report.json'); const bad=Object.entries(r.results).filter(([,v])=>v.status!=='OK'); if(bad.length){console.error(JSON.stringify(bad,null,2)); process.exit(1)}"

      - name: Verify private workbook is absent from workspace
        if: always()
        run: |
          test ! -e private-real-manifest.xlsx

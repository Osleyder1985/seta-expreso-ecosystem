services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev --http-port=8081 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8081"
    volumes:
      - ./realm-seta-expreso.json:/opt/keycloak/data/import/realm-seta-expreso.json:ro

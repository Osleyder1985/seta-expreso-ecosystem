groups:
  - name: seta-expreso-api
    rules:
      - alert: SeteExpresoApiHighErrorRate
        expr: |
          sum(rate(http_server_request_count_total{http_response_status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_request_count_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SETA EXPRESO API 5xx error rate is above 5%"
          description: "More than 5% of observed HTTP requests are returning 5xx responses for 10 minutes."

      - alert: SeteExpresoApiHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket[5m]))) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SETA EXPRESO API p95 latency is above 1 second"
          description: "Observed HTTP request p95 latency has exceeded 1 second for 10 minutes."
